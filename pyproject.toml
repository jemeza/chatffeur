[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatffeur"
version = "0.1.0"
description = "AI agent that books rides end-to-end with platform adapters, confirmation gates, and action logging"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "streamlit>=1.40",
    "httpx>=0.27",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
